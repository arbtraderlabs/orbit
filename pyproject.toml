[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-agent-control"
version = "0.1.0"
description = "Portable governed AI development orchestration bootstrap"
requires-python = ">=3.11"

[project.scripts]
orbit = "orbit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
